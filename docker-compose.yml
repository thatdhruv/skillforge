name: skillforge
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge
      POSTGRES_DB: skillforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge"]
      interval: 3s
      retries: 20

  memory:
    build: ./memory-service
    environment:
      DATABASE_URL: postgres://skillforge:skillforge@postgres:5432/skillforge
      REAP_INTERVAL_SECONDS: "60"
      ALLOW_RESET: "1"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
