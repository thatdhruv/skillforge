[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "A self-improving agent with verified skill memory, and an honest evaluation of whether it improves."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "mcp>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "confluent-kafka>=2.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillforge = "skillforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
