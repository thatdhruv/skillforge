{{- if .Values.redpanda.enabled }}
{{- $name := printf "%s-redpanda" (include "sf.name" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "sf.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $name }} }
  ports: [{ port: 9092, name: kafka }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "sf.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=768M
            - --reserve-memory=0M
            - --check=false
            - --node-id=0
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://{{ $name }}:9092
          ports: [{ containerPort: 9092, name: kafka }]
          readinessProbe:
            exec: { command: ["rpk", "cluster", "health"] }
            periodSeconds: 10
            initialDelaySeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/redpanda/data }]
          resources:
            requests: { cpu: 200m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.redpanda.storage }} } }
{{- end }}
