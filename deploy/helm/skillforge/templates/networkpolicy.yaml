{{- if .Values.networkPolicy.enabled }}
# Agent workers execute model-written code. Deny everything, then allow only what they legitimately need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sf.name" . }}-worker-egress
  labels: {{- include "sf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { sf-role: worker }
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector: { matchLabels: { app: {{ include "sf.name" . }}-memory } }
      ports: [{ port: 8080, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app: {{ include "sf.name" . }}-redpanda } }
      ports: [{ port: 9092, protocol: TCP }]
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- if eq .Values.pipeline.worker.llm "anthropic" }}
    - ports: [{ port: 443, protocol: TCP }]   # Anthropic API; tighten with an egress proxy if required
    {{- end }}
{{- end }}
